# Mykid — Apache configuration (enabled with a2enconf in the Dockerfile)

ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>

# Internal folders are only include()d by PHP — never served over HTTP.
# storage/ holds the runtime demo data (camera config, accounts, etc.).
<DirectoryMatch "^/var/www/html/(includes|docker|pack-[a-z]/includes|pack-[a-z]/storage)(/|$)">
    Require all denied
</DirectoryMatch>

# core/: PHP engine is internal; core/assets (CSS/JS) stays public.
<Directory /var/www/html/core>
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
</Directory>

<FilesMatch "^(\.ht.*|\.git.*|\.docker.*|Dockerfile)$">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
